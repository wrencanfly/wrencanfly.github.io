<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yingwei Noah Song — moved to yingwei.io</title>
    <link rel="canonical" href="https://yingwei.io/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Old Jekyll paths → their new homes on yingwei.io; anything else goes to the homepage.
      (function () {
        var p = location.pathname.replace(/\/+$/, "").toLowerCase();
        var map = [
          [/^\/publications/, "/research"],
          [/^\/projects/, "/projects"],
          [/^\/(cv|teaching|people)/, "/about"],
        ];
        var to = "/";
        for (var i = 0; i < map.length; i++) {
          if (map[i][0].test(p)) {
            to = map[i][1];
            break;
          }
        }
        location.replace("https://yingwei.io" + to);
      })();
    </script>
    <meta http-equiv="refresh" content="1; url=https://yingwei.io/" />
  </head>
  <body style="font: 15px/1.6 system-ui, sans-serif; padding: 48px 24px">
    <p>This site has moved to <a href="https://yingwei.io/">yingwei.io</a>.</p>
  </body>
</html>
